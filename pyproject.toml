[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "resolve-aio"
version = "0.1.0"
description = "All-in-one DaVinci Resolve plugin: MCP server, DCTL tools, automation, and AI chat"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "uvicorn>=0.24.0",
    "fastapi>=0.104.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
]

[project.scripts]
resolve-aio = "src.mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
